# data_subframes.yaml — Config for the St. John subframe dataset (mmap format)
# Stats computed from 29,400 training samples (3 crops/timestep × 9,800 timesteps)

# Point to the mmap directory instead of a pickle file
data_path: data_subframes

u_training_mean: -0.12131775915622711
u_training_std: 0.18608823418617249
v_training_mean: 0.01599905826151371
v_training_std: 0.09885834157466888
mag_mean: 0.19007815420627594

# Unified statistics for zscore_unified (preserves divergence-free property)
shared_mean: -0.0526593504473567
shared_std: 0.14899966879396356

gpu_to_use: 0

# === training ===
retrain_mode: False
model_to_retrain: "training_output/data/ddpm_ocean_model_best_checkpoint.pt"

partial_conv_mode: False

training_mode: True
testSeed: 0
epochs: 1000
batch_size: 80
lr: 0.001

standardizer_type:
  auto

standardizer_by_noise:
  gaussian: zscore
  div_free: zscore_unified
  spectral_div_free: zscore_unified

projection_by_noise:
  gaussian: false
  div_free: true
  spectral_div_free: true

noise_function: gaussian

loss_function:
  mse
w1: 0.6
w2: 0.4
num_workers: 0

# === Both ===
testSeed: -1
noise_steps: 250
min_beta: 0.0004
max_beta: 0.08

# === inpainting ===
inpainting_batch_size: 1
num_images_to_process: 1
n_samples: 1
resample_nums: [5]
save_pt_fields: False
enable_visualization: True

enable_divergence_projection: auto
clamp_project_cycles: 1
poisson_jacobi_iters: 200
poisson_dx: 1.0
poisson_dy: 1.0

# === guided diffusion inpainting ===
inpainting_method: guided
guidance_scale_boundary: 50.0
guidance_scale_div: 5.0

# === GP baseline ===
gp_lengthscale: 14.1
gp_variance: 0.0103420345
gp_noise: 0.00000001
gp_kernel_type: rbf_legacy
gp_coord_system: pixels
gp_use_double: True
gp_max_points: null
gp_sample_posterior: False

# === GP tuning (training set) ===
gp_tuning_num_images: 10
gp_tuning_lengthscales: [0.5, 1.0, 1.5, 2.0, 3.0]
gp_tuning_variances: [0.5, 1.0, 2.0]
gp_tuning_noises: [0.000001, 0.00001, 0.0001]
gp_tuning_masks:
  - straight_line
  - robot_path

# === autocorrelation analysis ===
gp_autocorr_num_images: 10
gp_autocorr_max_lag: 120

# === div-free inpainting ===
use_comb_net:
  no
comb_training_steps: 200
fidelity_weight: 1.0
physics_weight: 1.0
smooth_weight: 0.0
divergence_threshold: 0.06

pretrained_combnet_path: null

model_by_noise_type:
  gaussian: "ddpm/Trained_Models/ddpm_ocean_model_gaussian_t250.pt"
  div_free: "ddpm/Trained_Models/div_free_model.pt"
  spectral_div_free: "ddpm/Trained_Models/spectral_div_free_t250_best.pt"
