model_name: helmholtz_split_matched_noise

voronoi_forward: true
unet_type: helmholtz_split
prediction_target: x0
noise_function: helmholtz_matched

loss_function: helmholtz_supervised

helmholtz_loss:
  lambda_decomp: 0.1
  lambda_orth: 0.01

# Training recipe (matches helmholtz_split_decoder for fair comparison)
batch_size: 16
epochs: 400
lr: 0.0005
max_grad_norm: 1.0
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 10
use_ema: true
ema_decay: 0.9999
