model_name: helmholtz_matched_weakfullsup_eps

voronoi_forward: false
unet_type: helmholtz_split
prediction_target: eps
noise_function: helmholtz_matched

loss_function: helmholtz_supervised

helmholtz_loss:
  lambda_decomp: 0.1
  lambda_orth: 0.01
  decomp_t_max_frac: 1.0

batch_size: 16
epochs: 800
lr: 0.0001
max_grad_norm: 1.0
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 10
use_ema: true
ema_decay: 0.9999
