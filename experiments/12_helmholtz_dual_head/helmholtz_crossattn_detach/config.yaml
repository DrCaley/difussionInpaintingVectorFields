model_name: helmholtz_crossattn_detach

voronoi_forward: true
voronoi_known_fracs: [0.001, 0.002, 0.005, 0.01]
unet_type: helmholtz_split_film_crossattn
prediction_target: x0
noise_function: helmholtz_matched
mask_xt: false

loss_function: helmholtz_supervised

# Detach: block reconstruction MSE gradient from coupling ψ/φ heads.
# Only decomposition + orthogonality losses train the heads.
detach_heads: true

epochs: 800
batch_size: 16
lr: 0.0005
max_grad_norm: 1.0
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 10
use_ema: true
ema_decay: 0.9999

# Decomp loss is now the primary head training signal — increase weight.
helmholtz_loss:
  lambda_decomp: 1.0
  lambda_orth: 0.01
