model_name: helmholtz_supervised

voronoi_forward: true
unet_type: helmholtz
prediction_target: x0
noise_function: gaussian

# Helmholtz supervised decomposition loss
loss_function: helmholtz_supervised

helmholtz_loss:
  lambda_decomp: 0.1
  lambda_orth: 0.01

# Training recipe (matches helmholtz_baseline for fair comparison)
batch_size: 64
epochs: 400
lr: 0.0005
max_grad_norm: 1.0
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 10
use_ema: true
ema_decay: 0.9999
