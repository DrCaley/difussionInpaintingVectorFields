model_name: helmholtz_film_fullsup

voronoi_forward: true
voronoi_known_fracs: [0.001, 0.002, 0.005, 0.01]
unet_type: helmholtz_split_film
prediction_target: x0
noise_function: helmholtz_matched
mask_xt: true

loss_function: helmholtz_supervised

helmholtz_loss:
  lambda_decomp: 0.5
  lambda_orth: 0.1
  decomp_t_max_frac: 1.0

# Training recipe — match fullsup_800 settings
batch_size: 16
epochs: 800
lr: 0.0005
max_grad_norm: 1.0
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 10
use_ema: true
ema_decay: 0.9999

# Resume from best checkpoint (epoch 8) after NaN fix
retrain_mode: true
model_to_retrain: experiments/12_helmholtz_dual_head/helmholtz_film_fullsup/results/inpaint_helmholtz_matched_t250_best_checkpoint.pt
reset_best: false
