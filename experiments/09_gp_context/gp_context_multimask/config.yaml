# GP-context conditioned UNet with truly random masks (v3)
# Same 8-channel architecture as v2, but every sample gets a DIFFERENT random
# mask and its GP posterior is computed on the fly. No precompute needed.
# This gives infinite mask diversity for generalization.

model_name: gp_context_multimask
unet_type: gp_context
prediction_target: eps
noise_function: gaussian
mask_xt: true
gp_conditioned: true
augment: true

# ── On-the-fly GP: no precompute cache, random masks each sample ──
gp_cache_path: on_the_fly
gp_known_fracs: [0.001, 0.002, 0.005, 0.01]
gp_num_workers: 16

# ── Training hyperparams (same as v2 — proven stable) ──
lr: 0.0003
max_grad_norm: 1.0
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 10
use_ema: true
ema_decay: 0.9999

# ── Fresh training (no resume) ──
epochs: 1000
eval_max_batches: 10
